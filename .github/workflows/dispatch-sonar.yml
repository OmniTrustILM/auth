name: Dispatch Sonar
on:
  workflow_run:
    workflows: [ "Check PR" ]
    types: [ completed ]

permissions:
  actions: write # download artifact + create workflow dispatch
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download PR context artifact from upstream run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-context
          path: pr_context
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and validate inputs
        id: ctx
        run: |
          cat pr_context/pr-context.json
          # Values originate from a PR-produced artifact and are untrusted.
          # Read via jq (no eval) and validate against strict patterns before
          # propagating them to the privileged dispatch, so a crafted branch or
          # repo name cannot inject into downstream interpolation.
          PR_NUMBER=$(jq -r '.pr_number' pr_context/pr-context.json)
          HEAD_SHA=$(jq -r '.head_sha' pr_context/pr-context.json)
          HEAD_REPO=$(jq -r '.head_repo' pr_context/pr-context.json)
          HEAD_BRANCH=$(jq -r '.head_branch' pr_context/pr-context.json)
          BASE_REF=$(jq -r '.base_ref' pr_context/pr-context.json)
          RUN_ID=$(jq -r '.run_id' pr_context/pr-context.json)
          [[ "$PR_NUMBER"   =~ ^[0-9]+$ ]]                          || { echo "::error::bad pr_number";   exit 1; }
          [[ "$HEAD_SHA"    =~ ^[0-9a-f]{40}$ ]]                    || { echo "::error::bad head_sha";    exit 1; }
          [[ "$HEAD_REPO"   =~ ^[A-Za-z0-9_.][A-Za-z0-9_.-]*/[A-Za-z0-9_.][A-Za-z0-9_.-]*$ ]] || { echo "::error::bad head_repo";   exit 1; }
          [[ "$HEAD_BRANCH" =~ ^[A-Za-z0-9_.][A-Za-z0-9_./-]*$ ]]   || { echo "::error::bad head_branch"; exit 1; }
          [[ "$BASE_REF"    =~ ^[A-Za-z0-9_.][A-Za-z0-9_./-]*$ ]]   || { echo "::error::bad base_ref";    exit 1; }
          [[ "$RUN_ID"      =~ ^[0-9]+$ ]]                          || { echo "::error::bad run_id";      exit 1; }
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "head_repo=$HEAD_REPO"
            echo "head_branch=$HEAD_BRANCH"
            echo "base_ref=$BASE_REF"
            echo "run_id=$RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch Sonar workflow with inputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Pass the (now validated) values through env and read them via
        # process.env so no untrusted data is interpolated into the script body.
        env:
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          HEAD_REPO: ${{ steps.ctx.outputs.head_repo }}
          HEAD_BRANCH: ${{ steps.ctx.outputs.head_branch }}
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
          RUN_ID: ${{ steps.ctx.outputs.run_id }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sonar.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number:   process.env.PR_NUMBER,
                head_sha:    process.env.HEAD_SHA,
                head_repo:   process.env.HEAD_REPO,
                head_branch: process.env.HEAD_BRANCH,
                base_ref:    process.env.BASE_REF,
                run_id:      process.env.RUN_ID
              }
            });
